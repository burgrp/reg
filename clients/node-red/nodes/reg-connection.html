<script type="text/javascript">
  const regConnectionDefinition = {
    category: 'config',
    defaults: {
      name: { value: '' },
      registryUrl: { value: 'http://localhost:8080', required: false },
      consumerPollInterval: { value: 5000, required: true, validate: RED.validators.number() },
      providerPollInterval: { value: 5000, required: true, validate: RED.validators.number() }
    },
    label: function () {
      return this.name || 'Registry'
    }
  }

  RED.nodes.registerType('reg-connection', regConnectionDefinition)
</script>

<script type="text/html" data-template-name="reg-connection">
  <div class="form-row">
    <label for="node-config-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-config-input-name" placeholder="Registry">
  </div>
  <div class="form-row">
    <label for="node-config-input-registryUrl"><i class="fa fa-globe"></i> URL</label>
    <input type="text" id="node-config-input-registryUrl" placeholder="http://localhost:8080">
  </div>
  <div class="form-row">
    <label for="node-config-input-consumerPollInterval"><i class="fa fa-clock-o"></i> Consumer Poll (ms)</label>
    <input type="text" id="node-config-input-consumerPollInterval" placeholder="5000">
  </div>
  <div class="form-row">
    <label for="node-config-input-providerPollInterval"><i class="fa fa-clock-o"></i> Provider Poll (ms)</label>
    <input type="text" id="node-config-input-providerPollInterval" placeholder="5000">
  </div>
</script>

<script type="text/html" data-help-name="reg-connection">
  <p>Shared registry connection settings for reg nodes.</p>
  <p>URL defaults to the REGISTRY environment variable when empty.</p>
  <p>Provider Poll controls how quickly reg-provide receives consumer change requests.</p>
</script>
