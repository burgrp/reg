<script type="text/javascript">
  RED.nodes.registerType('reg-config', {
    category: 'config',
    defaults: {
      name: { value: '' },
      registryUrl: { value: 'http://localhost:8080', required: false },
      consumerPollInterval: { value: 5000, required: true, validate: RED.validators.number() },
      providerPollInterval: { value: 30000, required: true, validate: RED.validators.number() }
    },
    label: function () {
      return this.name || this.registryUrl || 'reg-config'
    }
  })
</script>

<script type="text/html" data-template-name="reg-config">
  <div class="form-row">
    <label for="node-config-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-config-input-name" placeholder="reg-config">
  </div>
  <div class="form-row">
    <label for="node-config-input-registryUrl"><i class="fa fa-globe"></i> Registry URL</label>
    <input type="text" id="node-config-input-registryUrl" placeholder="http://localhost:8080">
  </div>
  <div class="form-row">
    <label for="node-config-input-consumerPollInterval"><i class="fa fa-clock-o"></i> Consumer Poll (ms)</label>
    <input type="text" id="node-config-input-consumerPollInterval" placeholder="5000">
  </div>
  <div class="form-row">
    <label for="node-config-input-providerPollInterval"><i class="fa fa-clock-o"></i> Provider Poll (ms)</label>
    <input type="text" id="node-config-input-providerPollInterval" placeholder="30000">
  </div>
</script>

<script type="text/html" data-help-name="reg-config">
  <p>Shared registry connection settings for reg nodes.</p>
  <p>Registry URL defaults to the REGISTRY environment variable when empty.</p>
</script>
