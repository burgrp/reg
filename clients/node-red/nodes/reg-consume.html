<script type="text/javascript">
  RED.nodes.registerType('reg-consume', {
    category: 'registers',
    color: '#cde6ff',
    defaults: {
      name: { value: '', required: true },
      server: { value: '', type: 'reg-connection', required: true }
    },
    inputs: 1,
    outputs: 1,
    icon: 'font-awesome/fa-download',
    paletteLabel: 'consume',
    label: function () {
      return this.name ? this.name : 'consume'
    }
  })
</script>

<script type="text/html" data-template-name="reg-consume">
  <div class="form-row">
    <label for="node-input-server"><i class="fa fa-cog"></i> Registry</label>
    <input type="text" id="node-input-server">
  </div>
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Register name</label>
    <input type="text" id="node-input-name" placeholder="temperature">
  </div>
</script>

<script type="text/html" data-help-name="reg-consume">
  <p>Subscribes to a single register and emits updates.</p>
  <p>Input payload sends a change request for the configured register.</p>
  <p>Output: msg.topic=register name, msg.payload=value, msg.metadata=metadata object.</p>
</script>
