<script type="text/javascript">
  RED.nodes.registerType('reg-consume-all', {
    category: 'registers',
    color: '#E6D7F9',
    defaults: {
      name: { value: '' },
      server: { value: '', type: 'reg-connection', required: true }
    },
    inputs: 1,
    outputs: 1,
    icon: 'font-awesome/fa-list',
    paletteLabel: 'consume all',
    label: function () {
      return this.name || 'consume all'
    }
  })
</script>

<script type="text/html" data-template-name="reg-consume-all">
  <div class="form-row">
    <label for="node-input-server"><i class="fa fa-cog"></i> Registry</label>
    <input type="text" id="node-input-server">
  </div>
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Display name</label>
    <input type="text" id="node-input-name" placeholder="optional display name">
  </div>
</script>

<script type="text/html" data-help-name="reg-consume-all">
  <p>Subscribes to all registers and emits one message per changed register.</p>
  <p>Input requests a change using msg.topic as register name and msg.payload as requested value.</p>
  <p>Output: msg.topic=register name, msg.payload=value, msg.metadata=metadata object.</p>
</script>
